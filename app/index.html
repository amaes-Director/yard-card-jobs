/* ---------- photos ---------- */
async function shrink(file, max=1600){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(res,"image/jpeg",0.85));
  }finally{ URL.revokeObjectURL(url); }
}
const blobToB64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(b); });
async function handlePhoto(file, j){
  if(!file) return;
  toast("Adding photo…");
  let blob;
  try{ blob = await shrink(file); }catch(e){ return toast("That file isn't a photo this app can read"); }
  let assets = null;
  try{ assets = window.claude && await window.claude.use("assets"); }catch(e){}
  try{
    if(assets){
      const up = await assets.upload(blob, {type:"image/jpeg"});
      await store.saveJob({...j, photoId: up.id, photoData: null});
    }else{
      const data = "data:image/jpeg;base64," + await blobToB64(await shrink(file, 700));
      await store.saveJob({...j, photoData: data});
    }
    toast("Photo added"); render();
  }catch(e){
    const code = e && e.code;
    toast(code==="too_large" ? "Photo is too large — try another" : code==="quota_or_state" ? "Photo storage is full — delete old jobs' photos" : "Couldn't save the photo — try again");
  }
}
async function photoAttachment(j){
  try{
    let blob;
    if(j.photoId){ const r = await fetch("/_blob/"+j.photoId); if(!r.ok) return null; blob = await r.blob(); }
    else if(j.photoData){ blob = await (await fetch(j.photoData)).blob(); }
    else return null;
    const name = ((j.honoree||j.customerName||"yard-card").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "yard-card") + "-yard-card.jpg";
    return {content: await blobToB64(blob), filename: name, mimeType:"image/jpeg"};
  }catch(e){ return null; }
}

/* ---------- emails ---------- */
function buildMail(kind, j){
  const s = store.settings, biz = s.name || "Your yard card team", t = totals(j);
  const first = (j.customerName||"").split(" ")[0] || "there";
  const who = j.honoree || "your celebration";
  const sign = [s.signoff, biz, s.phone, s.email].filter(Boolean);
  const timesRows = [["Set up", fmtWhen(j.setupAt)], ["Take down", fmtWhen(j.takedownAt)], ["Address", j.address]];
  let subject="", intro="", sections=[], to=[j.email], attach=false;

  if(kind==="confirmation"){
    subject = `You're booked! ${j.occasion||"Yard card"} for ${who} — ${fmtDay(j.setupAt)}`;
    intro = `Hi ${first},\n\nThank you for booking with ${biz}! Here's a summary of your order so you can double-check everything. Just reply to this email if anything needs to change.`;
    sections = [
      {title:"Your sign", rows:[["Occasion", j.occasion||"—"],["For", j.honoree||"—"],["Message", j.message||"—"]].concat(j.team?[["Team", j.team]]:[]), note: j.request ? "Your request: " + j.request : ""},
      {title:"Set-up & take-down", rows: timesRows, note:"We'll place the sign at the set-up time above and come back to pick it up at take-down — no need to be home."},
      {title:"Price", rows: priceRows(j), note: s.payment ? "Payment: " + s.payment : ""}
    ];
  }else if(kind==="setup"){
    subject = `${j.honoree ? j.honoree+"'s" : "Your"} yard card is up! 🎉`;
    intro = `Hi ${first},\n\nYour yard card is set up and looking great — a photo is attached. We hope ${who==="your celebration"?"everyone":j.honoree} loves it!`;
    sections = [{title:"Pick-up reminder", rows:[["Take down", fmtWhen(j.takedownAt)],["Address", j.address]], note:"Please leave the sign in place until then. If you'd like it picked up at a different time, just reply."}];
    attach = true;
  }else if(kind==="pickup"){
    subject = `Reminder: we're picking up ${j.honoree ? j.honoree+"'s" : "your"} yard card ${fmtDay(j.takedownAt)}`;
    intro = `Hi ${first},\n\nA quick heads-up that ${biz} will be stopping by to take down ${j.honoree ? j.honoree+"'s" : "your"} yard card on ${fmtDay(j.takedownAt)} around ${fmtTime(j.takedownAt)}. No need to be home.`;
    sections = [{title:"Pick-up", rows:[["Take down", fmtWhen(j.takedownAt)],["Address", j.address]], note:"Please leave the sign where it is until then. Need a different pick-up time? Just reply to this email" + (s.phone ? " or call/text " + s.phone : "") + "."}];
    if(t.due>0) sections.push({title:"Balance due", rows:[["Balance due", money(t.due), true]], note: s.payment ? "Pay by: " + s.payment : "We'll send your invoice after pick-up."});
  }else if(kind==="reminder"){
    to = [s.email].filter(Boolean);
    subject = `Take-down reminder: ${j.customerName} · ${fmtWhen(j.takedownAt)}`;
    intro = `Pick up the yard card for ${j.customerName}${j.honoree?" ("+j.honoree+")":""}.`;
    sections = [{title:"Take-down", rows:[["When", fmtWhen(j.takedownAt)],["Address", j.address],["Customer phone", j.phone||"—"],["Balance due", money(t.due)]], note: j.request ? "Notes: " + j.request : ""}];
  }else if(kind==="final"){
    subject = `Thank you! Invoice ${invoiceNo(j)} from ${biz}`;
    intro = `Hi ${first},\n\nYour yard card has been picked up — thank you for letting us be part of ${j.honoree ? j.honoree+"'s" : "your"} ${ (j.occasion||"celebration").toLowerCase() }! Your invoice is below.`;
    const links = [["Facebook",s.facebook],["Instagram",s.instagram],["Google",s.google]].filter(x=>x[1]);
    sections = [
      {title:"Invoice " + invoiceNo(j), rows: priceRows(j).concat([["Balance due", money(t.due), true]]), note: (t.due>0 && s.payment) ? "Pay by: " + s.payment : (t.due<=0 ? "Paid in full — thank you!" : "")},
      {title:"Loved your sign?", rows:[], note:"A quick review or a tagged photo helps our small business more than you know." + (links.length ? "" : " Just reply and let us know how we did!"), links}
    ];
    attach = true;
  }
  return {kind, to, subject, intro, sections, sign, attach};
}
function priceRows(j){
  const t = totals(j), rows = [["Package", money(t.base)]];
  (j.addons||[]).forEach(a=>rows.push([a.desc||"Extra", money(a.amount)]));
  if(t.adds || t.paid) rows.push(["Total", money(t.total)]);
  if(t.paid) rows.push(["Deposit paid", "−" + money(t.paid)]);
  return rows;
}
function mailText(m){
  const out = [m.intro, ""];
  m.sections.forEach(s=>{
    out.push(s.title.toUpperCase());
    s.rows.forEach(r=>out.push(`${r[0]}: ${r[1]}`));
    if(s.note) out.push(s.note);
    (s.links||[]).forEach(l=>out.push(`${l[0]}: ${l[1]}`));
    out.push("");
  });
  out.push(m.sign.join("\n"));
  return out.join("\n");
}
function mailHtml(m, forPreview){
  const p = t => esc(t).replace(/\n/g,"<br>");
  const green = "#1E5C3B";
  let h = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#17231B;max-width:560px">`;
  h += `<p>${p(m.intro)}</p>`;
  m.sections.forEach(s=>{
    h += `<h3 style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:${green};margin:20px 0 6px">${esc(s.title)}</h3>`;
    if(s.rows.length){
      h += `<table style="border-collapse:collapse;width:100%">` + s.rows.map(r=>`<tr><td style="padding:6px 0;border-bottom:1px solid #D2DDCD;color:#4A5A4E">${esc(r[0])}</td><td style="padding:6px 0;border-bottom:1px solid #D2DDCD;text-align:right;${r[2]?"font-weight:bold;font-size:17px":""}">${esc(r[1])}</td></tr>`).join("") + `</table>`;
    }
    if(s.note) h += `<p style="margin:8px 0">${p(s.note)}</p>`;
    if(s.links && s.links.length) h += `<p>` + s.links.map(l=>`<a href="${esc(l[1])}" style="display:inline-block;background:${green};color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;margin:4px 6px 4px 0;font-weight:bold">Review us on ${esc(l[0])}</a>`).join("") + `</p>`;
  });
  h += `<p style="margin-top:22px">${m.sign.map(esc).join("<br>")}</p></div>`;
  return h;
}

let sending = false;
function openMail(kind, j){
  const m = buildMail(kind, j);
  const root = $("#sheet-root");
  const titles = {confirmation:"Booking confirmation", setup:"Set-up photo email", reminder:"Reminder to yourself", pickup:"Pick-up reminder to customer", final:"Invoice & review request"};
  const noTo = !m.to.length;
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <h3 id="sheet-h">${titles[kind]}</h3>
    <div class="to">To: <b>${esc(m.to.join(", ")||"— add your email under Business")}</b>${m.attach?(photoSrc(j)?" · 📎 yard photo attached":" · no photo yet"):""}</div>
    <label>Subject<input id="m-subject" value="${esc(m.subject)}"></label>
    <label style="margin-top:10px">Opening message<textarea id="m-intro" rows="5">${esc(m.intro)}</textarea></label>
    <div class="mail" id="m-preview">${mailHtml(m, true)}</div>
    <div id="m-status" class="status" hidden></div>
    <div class="row">
      ${window.claude ? `<button type="button" class="btn primary" id="m-send" ${noTo?"disabled":""}>Send with Gmail</button>
      <button type="button" class="btn" id="m-draft" ${noTo?"disabled":""}>Save as Gmail draft</button>` : `<button type="button" class="btn primary" id="m-open" ${noTo?"disabled":""}>Open in my email app</button>
      ${m.attach && photoSrc(j) ? `<button type="button" class="btn" id="m-share">Share with photo</button>` : ""}`}
      <button type="button" class="btn ghost" id="m-copy">Copy text</button>
      <button type="button" class="btn ghost" id="m-close">Close</button>
    </div>
  </div></div>`;
  const close = ()=>{ root.innerHTML=""; };
  $("#m-close").onclick = close;
  $("#scrim").onclick = e=>{ if(e.target.id==="scrim") close(); };
  const sync = ()=>{ m.subject = $("#m-subject").value; m.intro = $("#m-intro").value; $("#m-preview").innerHTML = mailHtml(m, true); };
  $("#m-subject").oninput = sync; $("#m-intro").oninput = sync;
  $("#m-copy").onclick = async ()=>{
    sync();
    const text = `To: ${m.to.join(", ")}\nSubject: ${m.subject}\n\n${mailText(m)}`;
    try{ await navigator.clipboard.writeText(text); toast("Email copied"); }
    catch(e){ const ta = $("#m-intro"); ta.value = text; ta.select(); toast("Text selected — copy it"); }
  };
  const doSend = async (draft)=>{
    if(sending) return; sending = true; sync();
    const st = $("#m-status"), bs = [$("#m-send"),$("#m-draft")];
    bs.forEach(b=>b.disabled=true); st.hidden=false; st.className="status"; st.textContent = draft ? "Saving draft…" : "Sending…";
    try{
      let mcp = null;
      try{ mcp = window.claude && await window.claude.use("mcp"); }catch(e){}
      if(!mcp) throw {code:"no_mcp"};
      const input = {to:m.to, subject:m.subject, body:mailText(m), htmlBody:mailHtml(m)};
      if(m.attach){ const a = await photoAttachment(j); if(a) input.attachments = [a]; }
      await mcp.callTool("Gmail", draft ? "create_draft" : "send_message", input, {cache:false});
      const fresh = store.jobs.find(x=>x.id===j.id) || j;
      const emails = {...(fresh.emails||{}), [kind]: {at:new Date().toISOString(), draft}};
      const up = {...fresh, emails};
      if(kind==="confirmation" && fresh.status==="booked") up.status = "confirmed";
      await store.saveJob(up);
      st.className="status ok"; st.textContent = draft ? "Draft saved in Gmail — open Gmail to review and send it." : "Sent from your Gmail.";
      setTimeout(()=>{ close(); render(); }, 1400);
    }catch(e){
      st.className="status err"; st.textContent = mailError(e);
      bs.forEach(b=>b.disabled=false);
    }finally{ sending = false; }
  };
  const markSent = async ()=>{
    const fresh = store.jobs.find(x=>x.id===j.id) || j;
    const up = {...fresh, emails:{...(fresh.emails||{}), [kind]:{at:new Date().toISOString(), app:true}}};
    if(kind==="confirmation" && fresh.status==="booked") up.status = "confirmed";
    await store.saveJob(up);
  };
  if($("#m-send")){ $("#m-send").onclick = ()=>doSend(false); $("#m-draft").onclick = ()=>doSend(true); }
  if($("#m-open")) $("#m-open").onclick = async ()=>{
    sync();
    const href = "mailto:" + m.to.map(encodeURIComponent).join(",") + "?subject=" + encodeURIComponent(m.subject) + "&body=" + encodeURIComponent(mailText(m));
    await markSent();
    const st = $("#m-status"); st.hidden = false; st.className = "status ok";
    st.textContent = "Your email app is opening with the message filled in. Check it and tap Send there." + (m.attach && photoSrc(j) ? " To include the yard photo, use Share with photo instead." : "");
    location.href = href;
  };
  if($("#m-share")) $("#m-share").onclick = async ()=>{
    sync();
    const st = $("#m-status"); st.hidden = false;
    try{
      const blob = await (await fetch(photoSrc(j))).blob();
      const file = new File([blob], ((j.honoree||j.customerName||"yard-card").replace(/[^A-Za-z0-9]+/g,"-") || "yard-card") + "-yard-card.jpg", {type:"image/jpeg"});
      if(!(navigator.canShare && navigator.canShare({files:[file]}))) throw {code:"no_share"};
      await navigator.share({files:[file], title:m.subject, text:`To: ${m.to.join(", ")}\nSubject: ${m.subject}\n\n${mailText(m)}`});
      await markSent();
      st.className = "status ok"; st.textContent = "Pick your email app, then check the To and Subject lines before sending.";
    }catch(e){
      if(e && e.name==="AbortError"){ st.hidden = true; return; }
      st.className = "status err"; st.textContent = "This phone can't share the photo from here. Use Open in my email app, then attach the photo from your camera roll.";
    }
  };
}
function mailError(e){
  const c = e && e.code;
  switch(c){
    case "no_mcp": case "not_granted": case "capability_disabled": case "capability_removed":
      return "Gmail isn't available in this view. Use Copy text and paste it into your email app.";
    case "needs_reauth": return "Gmail needs you to sign in again: reconnect Gmail in claude.ai Settings → Connectors, then try again.";
    case "server_not_connected": case "selection_required": case "server_not_found":
      return "Gmail isn't connected. Add Gmail in claude.ai Settings → Connectors, or use Copy text.";
    case "not_in_manifest": return "Gmail is turned off for this app. Allow it when asked, or use Copy text.";
    case "blocked_by_policy": case "approval_required": return "Your organization blocks sending email from here. Use Copy text instead.";
    case "tool_error": return "Gmail refused the message: " + (e.message || "check the address and try again.");
    case "server_unavailable": case "upstream_error":
      return "Gmail didn't confirm. Check your Sent folder before trying again so the customer doesn't get it twice.";
    default: return "Couldn't send: " + (e && e.message || "try again or use Copy text.");
  }
}

/* ---------- boot ---------- */
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
// A setup link (app/#sync=<address>) fills in the sync address, so it needn't be typed on a phone.
let pendingSyncUrl = "";
if(location.hash.startsWith("#sync=")){
  pendingSyncUrl = decodeURIComponent(location.hash.slice(6));
  history.replaceState(null, "", location.pathname + location.search);
}
render();
store.init().then(()=>{
  if(store.mode!=="local") return;
  // Ask the browser to keep this app's saved jobs even when the phone runs low on space.
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  if(pendingSyncUrl && !sync.cfg()){ go("settings"); toast("Enter your sync code, then Save business details"); setTimeout(()=>{ const c = $("#sy-code"); if(c) c.focus(); }, 300); }
  sync.run();
  const v = sync.st(); if(v.conflicts.length) setTimeout(()=>sync.ask(), 500);
});
addEventListener("online", ()=>{ sync.tries = 0; sync.run(); });
addEventListener("offline", ()=>store.emit());
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) sync.run(); });
// Check now and then for changes made on the other device.
setInterval(()=>{ if(!document.hidden) sync.run(); }, 2*60*1000);
// The "reminder due" alert depends on the clock, so refresh the Jobs list now and then.
setInterval(()=>{ if(route.view==="jobs" && !document.hidden) render(); }, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && route.view==="jobs") render(); });
setInterval(()=>{ if(route.view==="jobs"||route.view==="job") render(); }, 60000);
})();
</script>
