<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5C3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yard Cards">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Yard Card Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F1F5EF; --surface:#FFFFFF; --surface-2:#E6EEE3; --line:#D2DDCD;
  --ink:#17231B; --ink-2:#4A5A4E; --ink-3:#768679;
  --lawn:#1E5C3B; --lawn-ink:#FFFFFF; --lawn-soft:#DCEBDF;
  --pop:#F2B632; --pop-ink:#2A1E00; --pop-soft:#FCEFC9;
  --sky:#2F6FA8; --sky-soft:#DDEAF6;
  --warn:#B4441F; --warn-soft:#F8E1D8;
  --shadow:0 1px 2px rgba(23,35,27,.06),0 6px 18px rgba(23,35,27,.06);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1712; --surface:#18231C; --surface-2:#213027; --line:#2E3F33;
    --ink:#E9F0EA; --ink-2:#B3C2B6; --ink-3:#83958A;
    --lawn:#5DBB84; --lawn-ink:#08140D; --lawn-soft:#1D3527;
    --pop:#F5C451; --pop-ink:#231800; --pop-soft:#3A2F12;
    --sky:#7DB3E6; --sky-soft:#1B2C3D;
    --warn:#F08A63; --warn-soft:#3A2018;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1712; --surface:#18231C; --surface-2:#213027; --line:#2E3F33;
  --ink:#E9F0EA; --ink-2:#B3C2B6; --ink-3:#83958A;
  --lawn:#5DBB84; --lawn-ink:#08140D; --lawn-soft:#1D3527;
  --pop:#F5C451; --pop-ink:#231800; --pop-soft:#3A2F12;
  --sky:#7DB3E6; --sky-soft:#1B2C3D;
  --warn:#F08A63; --warn-soft:#3A2018;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pop);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--lawn);color:var(--lawn-ink);border-radius:10px;font-family:var(--display);font-size:22px;transform:rotate(-4deg)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:inherit;display:block}
.logo.has-img{background:var(--surface);border:1px solid var(--line);transform:none}
.brand-row{display:flex;align-items:center;gap:14px}
.brand-prev{width:72px;height:72px;flex:none;display:grid;place-items:center;border-radius:18px;overflow:hidden;color:#fff;font-family:var(--display);font-size:34px;border:1px solid var(--line);background:var(--surface)}
.brand-prev img{width:100%;height:100%;object-fit:contain}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{display:block;position:relative;cursor:pointer}
.swatches input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.swatches span{display:block;width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.swatches input:focus-visible+span{outline:3px solid var(--pop);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;font-size:14.5px}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--lawn)}
.chk-row{display:flex;align-items:center;gap:8px}
.chk-row .chk{flex:1;min-width:0}
.qty{width:68px;flex:none;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center;font-weight:700}
details.cat{border-top:1px solid var(--line);padding:6px 0}
details.cat summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .n{font-weight:600;color:var(--ink-3);font-size:12.5px}
.ex{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ex img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;border:1px solid var(--line)}
.ex .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.exprev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
.top h1{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.3px;line-height:1.1}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.top .back{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:10px;cursor:pointer;flex:none;font-size:18px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:8px;align-items:center;width:100%;max-width:560px}
.nav button{border:0;background:none;cursor:pointer;padding:6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button[aria-current="page"]{color:var(--lawn)}
.nav .ico{font-size:18px;line-height:1}
.nav .add{background:var(--pop);color:var(--pop-ink);border-radius:999px;padding:10px 22px;flex-direction:row;gap:6px;font-size:15px;font-weight:700;box-shadow:var(--shadow)}

/* banners */
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-block:4px 12px;background:var(--pop-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.banner b{font-weight:700}
.btn.keep{flex-direction:column;gap:2px}.btn.keep .fine{font-weight:400;color:inherit;opacity:.85}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-decoration:underline;cursor:pointer}

/* sections & job cards */
.sec{margin-block:18px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.sec .count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.list{display:grid;gap:10px}
.job{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 10px;cursor:pointer;text-align:left;width:100%}
.job:hover{border-color:var(--ink-3)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:22px;color:var(--lawn)}
.thumb img{width:100%;height:100%;object-fit:cover}
.job .nm{font-weight:700;font-size:15.5px;line-height:1.25}
.job .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
.job .when{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-booked{background:var(--sky-soft);color:var(--sky)}
.st-confirmed{background:var(--sky-soft);color:var(--sky)}
.st-setup{background:var(--pop-soft);color:var(--ink)}
.st-setup::before{background:var(--pop)}
.st-complete{background:var(--lawn-soft);color:var(--lawn)}
.st-due{background:var(--warn-soft);color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3);border:1.5px dashed var(--line);border-radius:14px;font-size:14px}

/* detail */
.hero{background:var(--lawn);color:var(--lawn-ink);border-radius:16px;padding:16px;display:grid;gap:6px;position:relative;overflow:hidden}
.hero .occ{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.08}
.hero .msg{font-size:14px;opacity:.92}
.hero .stakes{position:absolute;right:14px;top:12px;display:flex;gap:3px;opacity:.9}
.hero .stakes span{width:22px;height:26px;border-radius:4px;background:var(--pop);color:var(--pop-ink);font-family:var(--display);font-size:16px;display:grid;place-items:center}
.hero .stakes span:nth-child(2n){transform:translateY(3px) rotate(4deg)}
.hero .stakes span:nth-child(3n){transform:rotate(-5deg)}

.steps{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;font-weight:600}
.steps .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.steps .done{color:var(--lawn)}
.steps .done .n{background:var(--lawn);color:var(--lawn-ink)}
.steps .now{color:var(--ink);border-color:var(--pop);box-shadow:0 0 0 2px var(--pop-soft)}
.steps .now .n{background:var(--pop);color:var(--pop-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h3{font-size:16px;font-weight:700;margin-bottom:4px}
.card p.hint{margin:0 0 10px;color:var(--ink-2);font-size:13.5px}
.card.action{border:2px solid var(--pop);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-size:13px}
.kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 14px;font-weight:700;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--lawn);color:var(--lawn-ink);border-color:var(--lawn)}
.btn.pop{background:var(--pop);color:var(--pop-ink);border-color:var(--pop)}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);background:none}
.btn.wide{flex:1 1 100%}
.btn[disabled]{opacity:.55;cursor:default}
.sent{font-size:12.5px;color:var(--lawn);font-weight:600;margin-top:8px}
.photo{border-radius:12px;overflow:hidden;background:var(--surface-2);margin-top:6px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--ink-3);font-size:13.5px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.countdown{font-family:var(--display);font-size:22px;color:var(--warn);font-weight:400;line-height:1.1}

/* forms */
form{display:grid;gap:14px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
legend{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px;padding:0}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two input{min-width:0}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.addon{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;align-items:end}
.addon .x{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;padding-top:8px;border-top:1px solid var(--line)}
.fine{font-size:12.5px;color:var(--ink-3)}
.inv-row{display:grid;grid-template-columns:1fr auto 76px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}
.inv-row:first-of-type{border-top:0}
.inv-row .use{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.inv-row .qty{width:76px}
.inv-cat{font-weight:700;font-size:13px;margin:12px 0 2px;color:var(--ink-2)}
.free{font-size:12px;font-weight:700;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.free.short{color:var(--warn)}
select{min-width:0;max-width:100%;text-overflow:ellipsis}
label,fieldset{min-width:0}

/* sheet (email preview) */
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px}
.sheet .to{font-size:13.5px;color:var(--ink-2);margin:4px 0 12px;overflow-wrap:anywhere}
.mail{background:#FFFFFF;color:#17231B;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;margin-top:10px;overflow-x:auto}
.mail table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.mail td{padding:5px 0;border-bottom:1px solid var(--line)}
.mail td:last-child{text-align:right}
.status{margin-top:10px;font-size:13.5px;border-radius:10px;padding:10px 12px}
.status.ok{background:var(--lawn-soft);color:var(--ink)}
.status.err{background:var(--warn-soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button type="button" id="nav-jobs" data-go="jobs"><span class="ico" aria-hidden="true">▤</span>Jobs</button>
    <button type="button" id="nav-crew" data-go="crew"><span class="ico" aria-hidden="true">👷</span>Crew</button>
    <button type="button" class="add" id="nav-new" data-go="new"><span aria-hidden="true">＋</span> New booking</button>
    <button type="button" id="nav-settings" data-go="settings"><span class="ico" aria-hidden="true">⚙</span>Business</button>
  </div>
</nav>
<div id="sheet-root"></div>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Number(n)||0).toFixed(2);
const DEFAULT_SETTINGS = {
  name:"", email:"", phone:"", payment:"", facebook:"", instagram:"", google:"", signoff:"Thanks for celebrating with us!",
  logo:"", iconText:"", iconColor:"#1E5C3B",
  workers:"", workerLeadHours:"24", workerText:"", signs:"", inventory:{}, area:"", localTeams:""
};
const NUMBER_SIGNS = Array.from({length:11},(_,k)=>"Number "+k);
const MI_PRO = ["Detroit Lions","Detroit Tigers","Detroit Pistons","Detroit Red Wings","Detroit City FC","Michigan Panthers"];
const MI_COLLEGE = ["Michigan Wolverines","Michigan State Spartans","Central Michigan Chippewas","Eastern Michigan Eagles","Western Michigan Broncos","Oakland Golden Grizzlies","Detroit Mercy Titans","Wayne State Warriors","Grand Valley State Lakers","Ferris State Bulldogs","Saginaw Valley State Cardinals","Michigan Tech Huskies","Northern Michigan Wildcats","Lake Superior State Lakers","UM-Flint","UM-Dearborn","Kettering Bulldogs","Davenport Panthers","Hope Flying Dutch","Calvin Knights","Hillsdale Chargers","Albion Britons","Alma Scots","Kalamazoo Hornets","Adrian Bulldogs","Olivet Comets","Aquinas Saints","Cornerstone Golden Eagles","Lawrence Tech Blue Devils","Madonna Crusaders","Siena Heights Saints","Spring Arbor Cougars","Concordia Ann Arbor Cardinals","Mott Bears","Delta College Pioneers"];
const DEFAULT_WORKER_TEXT = "Hi {worker}, set-up for {honoree} ({occasion}) — {setup}.\nAddress: {address}\nMessage on the lawn: {message}\nTeam: {team}\nSigns to bring: {signs}\nNotes: {notes}\nExample photo: {photo}\nTake-down: {takedown}\nCustomer: {customer} {phone}\nQuestions? Call {business}.";
const DEFAULT_SIGNS = "Birthday: Happy Birthday banner, Balloon arch, Cake topper sign, Confetti stakes\nGraduation: Congrats Grad banner, Class year sign, Cap & diploma stakes, School-color balloons\nNew baby: Welcome baby sign, Stork sign, Baby name letters, Pink or blue balloons\nAnniversary: Happy Anniversary banner, Heart stakes\nWelcome home: Welcome home banner, Flag stakes, Balloon bouquet\nRetirement: Happy Retirement banner, Years-of-service sign, Hobby theme stakes\nHoliday: Seasonal theme sign, String lights, Lawn ornaments";
const ICON_COLORS = ["#1E5C3B","#2F6FA8","#B4441F","#7A3E9D","#C48A00","#222222"];

/* ---------- storage: db when available, this browser otherwise ---------- */
const store = {
  mode:"loading", jobs:[], examples:[], settings:{...DEFAULT_SETTINGS}, db:null, listeners:[],
  emit(){ this.listeners.forEach(f=>f()); },
  local(key, val){
    try{
      if(val===undefined){ const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
      localStorage.setItem(key, JSON.stringify(val));
    }catch(e){ if(val!==undefined) toast("This phone's storage for the app is full. Delete old finished jobs or their photos."); return null; }
  },
  async init(){
    let db = null;
    try{ db = window.claude && await window.claude.use("db"); }catch(e){ db = null; }
    if(db){
      this.db = db; this.mode = "db";
      db.collection("jobs").onSnapshot(snap=>{
        this.jobs = snap.docs.map(d=>({id:d.id, ...d.data()})); this.emit();
      }, ()=>{ this.mode="db-error"; this.emit(); });
      db.doc("settings/business").onSnapshot(s=>{
        this.settings = {...DEFAULT_SETTINGS, ...(s.exists ? s.data() : {})}; this.emit();
      });
      db.collection("examples").onSnapshot(snap=>{
        this.examples = snap.docs.map(d=>({id:d.id, ...d.data()})); this.emit();
      }, ()=>{});
    }else{
      this.mode = "local";
      this.jobs = this.local("ycj-jobs") || [];
      this.settings = {...DEFAULT_SETTINGS, ...(this.local("ycj-settings")||{})};
      this.examples = this.local("ycj-examples") || [];
      this.emit();
    }
  },
  async saveJob(job){
    job.updatedAt = new Date().toISOString();
    const {id, ...data} = job;
    if(this.db){ await this.db.doc("jobs/"+id).set(JSON.parse(JSON.stringify(data))); }
    else{
      const i = this.jobs.findIndex(j=>j.id===id);
      if(i<0) this.jobs.push(job); else this.jobs[i] = job;
      this.local("ycj-jobs", this.jobs); sync.mark("job:"+id); this.emit();
    }
  },
  async removeJob(id){
    if(this.db){ await this.db.doc("jobs/"+id).delete(); }
    else{ this.jobs = this.jobs.filter(j=>j.id!==id); this.local("ycj-jobs", this.jobs); sync.mark("job:"+id, true); this.emit(); }
  },
  async saveSettings(s){
    if(this.db){ await this.db.doc("settings/business").set(s); this.settings = s; }
    else{ s.updatedAt = new Date().toISOString(); this.settings = s; this.local("ycj-settings", s); sync.mark("settings:business"); this.emit(); }
  },
  async saveExample(ex){
    if(!this.db) ex.updatedAt = new Date().toISOString();
    const {id, ...data} = ex;
    if(this.db){ await this.db.doc("examples/"+id).set(JSON.parse(JSON.stringify(data))); }
    const i = this.examples.findIndex(x=>x.id===id);
    if(i<0) this.examples.push(ex); else this.examples[i] = ex;
    if(!this.db){ this.local("ycj-examples", this.examples); sync.mark("example:"+id); this.emit(); }
  },
  async removeExample(id){
    if(this.db){ await this.db.doc("examples/"+id).delete(); }
    this.examples = this.examples.filter(x=>x.id!==id);
    if(!this.db){ this.local("ycj-examples", this.examples); sync.mark("example:"+id, true); this.emit(); }
  }
};


/* ---------- Drive sync: only in this-browser mode, once a sync address and code are entered ----------
   Each job, example and the business details is sent on its own with the version this device
   last saw from Drive. Drive refuses a change when another device changed the same thing first,
   and the app then asks which version to keep. */
const sync = {
  busy:false, failed:false, timer:null, tries:0, lastOk:0,
  cfg(){ const c = store.local("ycj-sync"); return c && c.url && c.code ? c : null; },
  st(){ const v = store.local("ycj-sync-state") || {}; return {since:0, base:{}, pending:{}, conflicts:[], ...v}; },
  save(v){ store.local("ycj-sync-state", v); },
  waiting(){ return Object.keys(this.st().pending).length; },
  mark(key, deleted){
    if(!this.cfg()) return;
    const v = this.st();
    v.pending[key] = {deleted: !!deleted, at: new Date().toISOString()};
    this.save(v); this.soon(800);
  },
  // What this device has now for a key, in the shape Drive keeps.
  rec(key, p){
    const [kind, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":")+1)];
    if(p.deleted) return {updatedAt: p.at, deleted:true};
    const item = kind==="job" ? store.jobs.find(x=>x.id===id) : kind==="example" ? store.examples.find(x=>x.id===id) : store.settings;
    if(!item) return {updatedAt: p.at, deleted:true};
    return {updatedAt: item.updatedAt || p.at, data: item};
  },
  apply(key, rec){
    const kind = key.slice(0, key.indexOf(":")), id = key.slice(key.indexOf(":")+1);
    if(kind==="settings"){ if(!rec.deleted){ store.settings = {...DEFAULT_SETTINGS, ...rec.data}; store.local("ycj-settings", store.settings); } return; }
    const list = kind==="job" ? "jobs" : "examples";
    let arr = store[list].filter(x=>x.id!==id);
    if(!rec.deleted) arr.push({...rec.data, id});
    store[list] = arr; store.local(kind==="job" ? "ycj-jobs" : "ycj-examples", arr);
  },
  soon(ms){ clearTimeout(this.timer); this.timer = setTimeout(()=>this.run(), ms); },
  async run(){
    const c = this.cfg(); if(!c || this.busy) return;
    if(navigator.onLine===false){ this.failed = true; store.emit(); return; }
    this.busy = true;
    let v = this.st(), changed = false;
    const sent = {};
    const changes = Object.keys(v.pending).filter(k=>!v.conflicts.some(x=>x.key===k)).map(k=>{ const rec = this.rec(k, v.pending[k]); sent[k] = rec.updatedAt; return {key:k, base: v.base[k]||null, rec}; });
    try{
      const r = await fetch(c.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({code:c.code, since:v.since, changes}), redirect:"follow"});
      const out = await r.json();
      if(!out.ok) throw Object.assign(new Error(out.error||"failed"), {code: out.error});
      v = this.st(); // re-read: the person may have saved something while this was sending
      const clash = new Set((out.conflicts||[]).map(x=>x.key));
      (out.conflicts||[]).forEach(x=>{
        // A device that never had business details just takes the ones from Drive.
        if(x.key==="settings:business" && !store.settings.name && x.theirs){ this.apply(x.key, x.theirs); v.base[x.key] = x.theirs.updatedAt; delete v.pending[x.key]; changed = true; return; }
        if(!v.conflicts.some(y=>y.key===x.key)) v.conflicts.push(x);
      });
      Object.keys(sent).forEach(k=>{
        if(clash.has(k)) return;
        v.base[k] = sent[k];
        const now = v.pending[k] && this.rec(k, v.pending[k]).updatedAt;
        if(now===sent[k]) delete v.pending[k];
      });
      (out.items||[]).forEach(({key, rec})=>{
        if(!rec || clash.has(key) || v.conflicts.some(x=>x.key===key)) return;
        if(v.pending[key]){ return; } // changed here again since sending; it goes up next round
        if(v.base[key]===rec.updatedAt) return;
        this.apply(key, rec); v.base[key] = rec.updatedAt; changed = true;
      });
      v.since = out.rev || v.since;
      v.badCode = false;
      this.save(v); this.failed = false; this.tries = 0; this.lastOk = Date.now();
      this.busy = false;
      if(changed || clash.size || changes.length) store.emit();
      if(out.more || Object.keys(v.pending).some(k=>!v.conflicts.some(x=>x.key===k))) this.soon(300);
      if(v.conflicts.length) this.ask();
    }catch(e){
      this.busy = false; this.failed = true; this.tries++;
      if(e && e.code==="code"){ const w = this.st(); w.badCode = true; this.save(w); store.emit(); return; }
      store.emit();
      this.soon(Math.min(60000, 3000 * Math.pow(2, this.tries-1)));
    }
  },
  // Turned on from Business → Drive sync. Everything already on this device goes up once.
  connect(url, code){
    store.local("ycj-sync", {url, code});
    const v = this.st(), at = new Date().toISOString();
    v.badCode = false;
    const add = k=>{ if(!(k in v.base) && !v.pending[k]) v.pending[k] = {deleted:false, at}; };
    store.jobs.forEach(j=>add("job:"+j.id));
    store.examples.forEach(x=>add("example:"+x.id));
    if(store.settings.name || store.settings.updatedAt) add("settings:business");
    this.save(v); this.tries = 0; this.run();
  },
  disconnect(){ store.local("ycj-sync", {}); store.local("ycj-sync-state", {}); this.failed = false; store.emit(); },
  // Problems worth a line on the Jobs screen. Nothing shows while everything is saved in Drive.
  banner(){
    if(!this.cfg()) return "";
    const v = this.st();
    if(v.badCode) return `<div class="banner warn"><b>Drive sync stopped.</b> The sync code doesn't match. Check it under Business → Drive sync.</div>`;
    if(v.conflicts.length) return `<div class="banner warn"><b>A job was changed on two devices.</b> <button type="button" class="linkbtn" data-sync-ask>Choose which to keep</button></div>`;
    const n = Object.keys(v.pending).length;
    if(n && (this.failed || navigator.onLine===false)) return `<div class="banner warn"><b>${n} ${n===1?"change":"changes"} waiting for signal.</b> Don't clear this browser until this message goes away.</div>`;
    return "";
  },
  ask(){
    const v = this.st(), x = v.conflicts[0]; if(!x) return;
    const root = $("#sheet-root"); if(root.innerHTML) return;
    const kind = x.key.slice(0, x.key.indexOf(":")), id = x.key.slice(x.key.indexOf(":")+1);
    const mine = kind==="job" ? store.jobs.find(j=>j.id===id) : kind==="example" ? store.examples.find(e=>e.id===id) : store.settings;
    const theirs = x.theirs || {};
    const what = kind==="settings" ? "Your business details" : kind==="example" ? "An example photo" : "The job for " + ((mine&&mine.honoree)||(theirs.data&&theirs.data.honoree)||"a customer");
    const desc = (rec, item)=> rec && rec.deleted || !item ? "Deleted on that device" : (kind==="job" && item.message ? `“${esc(item.message)}” · ` : kind==="settings" && item.name ? esc(item.name)+" · " : "") + "changed " + esc(fmtTime(item.updatedAt));
    root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
      <h3 id="sheet-h">Which version should we keep?</h3>
      <p class="fine">${esc(what)} was changed on this device and on another device before they synced.</p>
      <div class="row">
        <button type="button" class="btn primary wide keep" data-keep="mine">Keep this device's<span class="fine">${desc(null, mine)}</span></button>
        <button type="button" class="btn wide keep" data-keep="theirs">Keep the other device's<span class="fine">${desc(theirs, theirs.data)}</span></button>
      </div>
    </div></div>`;
    root.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>{
      const w = this.st();
      w.conflicts = w.conflicts.filter(y=>y.key!==x.key);
      if(b.dataset.keep==="mine"){
        w.base[x.key] = theirs.updatedAt || null;
        if(!w.pending[x.key]) w.pending[x.key] = {deleted:!mine, at:new Date().toISOString()};
      }else{
        delete w.pending[x.key];
        if(x.theirs){ this.apply(x.key, x.theirs); w.base[x.key] = x.theirs.updatedAt; }
      }
      this.save(w); root.innerHTML = ""; toast("Kept"); store.emit(); render();
      if(w.conflicts.length) setTimeout(()=>this.ask(), 300); else this.run();
    });
  }
};

/* ---------- helpers ---------- */
const newId = () => "j" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const toDate = s => s ? new Date(s) : null;
function fmtWhen(s){
  const d = toDate(s); if(!d || isNaN(d)) return "—";
  return d.toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function fmtDay(s){
  const d = toDate(s); if(!d || isNaN(d)) return "—";
  return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
function fmtTime(s){
  const d = toDate(s); if(!d || isNaN(d)) return "—";
  return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function relTime(s){
  const d = toDate(s); if(!d) return "";
  const mins = Math.round((d - Date.now())/60000);
  const a = Math.abs(mins);
  const txt = a < 60 ? a+" min" : a < 60*36 ? Math.round(a/60)+" hr" : Math.round(a/1440)+" days";
  return mins >= 0 ? "in " + txt : txt + " ago";
}
function totals(j){
  const base = Number(j.price)||0;
  const adds = (j.addons||[]).reduce((s,a)=>s+(Number(a.amount)||0),0);
  const total = base + adds;
  const paid = Number(j.deposit)||0;
  return {base, adds, total, paid, due: Math.max(0,total-paid)};
}
function stage(j){
  if(j.status==="complete") return 3;
  if(j.status==="setup") return 2;
  return 1;
}
function parseWorkers(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(.*?)[,\s]+([+(]?\d[\d\s().+-]{5,})$/);
    return m ? {name:m[1].trim(), phone:m[2].trim()} : {name:l, phone:""};
  });
}
function parseSigns(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const i = l.indexOf(":");
    if(i<0) return {name:l, items:[]};
    return {name:l.slice(0,i).trim(), items:l.slice(i+1).split(",").map(x=>x.trim()).filter(Boolean)};
  }).filter(c=>c.items.length);
}
function exSrc(ex){ return ex.photoId ? "/_blob/"+ex.photoId : (ex.photoData||""); }
function pickExample(j){
  const list = store.examples || [];
  if(j.exampleId){ const e = list.find(x=>x.id===j.exampleId); if(e) return e; }
  const occ = (j.occasion||"").trim().toLowerCase();
  return occ ? (list.find(x=>(x.category||"").trim().toLowerCase()===occ) || null) : null;
}
function buildCrewText(j, worker){
  const s = store.settings;
  const vals = {worker: worker||"team", customer:j.customerName, honoree:j.honoree||j.customerName, occasion:j.occasion, message:j.message, address:j.address,
    setup: j.setupAt?fmtWhen(j.setupAt):"", takedown: j.takedownAt?fmtWhen(j.takedownAt):"", signs:(j.signs||[]).map(i=>{ const q = Number((j.signQty||{})[i])||1; return q>1 ? q+" × "+i : i; }).join(", "), notes:j.workerNote, team:j.team, phone:j.phone, business:s.name||s.phone, photo:((typeof pickExample==="function" && pickExample(j))||{}).link||""};
  const tpl = s.workerText||DEFAULT_WORKER_TEXT;
  const out = tpl.split("\n").map(line=>{
    const keys = [...line.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);
    if(keys.length && keys.every(k=>!String(vals[k]||"").trim())) return null;
    return line.replace(/\{(\w+)\}/g,(m,k)=>k in vals ? String(vals[k]||"").trim() : m).replace(/\s+$/,"");
  }).filter(l=>l!==null).join("\n");
  // older saved wording may not have {photo}; add the link anyway
  return (!/\{photo\}/.test(tpl) && vals.photo) ? out + "\nExample photo: " + vals.photo : out;
}
function needsCrewText(j){
  if((j.status!=="booked" && j.status!=="confirmed") || j.crewSent || j.crewSkip) return false;
  const st = toDate(j.setupAt); if(!st || isNaN(st) || st <= Date.now()) return false;
  const hrs = Number(store.settings.workerLeadHours)||24;
  return st <= Date.now() + hrs*3600e3;
}
/* ---------- sign inventory ---------- */
function owned(name){ const v = (store.settings.inventory||{})[name]; return v===undefined||v===""||v===null ? null : Math.max(0, parseInt(v,10)||0); }
function qtyOf(j, name){ return (j.signs||[]).includes(name) ? (Number((j.signQty||{})[name])||1) : 0; }
const reserves = j => j.status!=="complete";
function overlaps(a, b){
  const a1 = toDate(a.setupAt), a2 = toDate(a.takedownAt), b1 = toDate(b.setupAt), b2 = toDate(b.takedownAt);
  if(!a1||!a2||!b1||!b2||isNaN(a1)||isNaN(a2)||isNaN(b1)||isNaN(b2)) return false;
  return a1 < b2 && b1 < a2;
}
// Signs other open jobs need during this job's dates
function busyFor(j, name){ return store.jobs.filter(o=>o.id!==j.id && reserves(o) && overlaps(o,j)).reduce((n,o)=>n+qtyOf(o,name),0); }
function freeFor(j, name){ const own = owned(name); return own===null ? null : own - busyFor(j, name); }
function inYardNow(name){ return store.jobs.filter(o=>o.status==="setup").reduce((n,o)=>n+qtyOf(o,name),0); }
function freeLabel(j, name){
  const free = freeFor(j, name); if(free===null) return "";
  const want = qtyOf(j, name), short = want > free;
  return `<span class="free${short?" short":""}" data-free="${esc(name)}">${short ? (free<=0?"None free":"Only "+free+" free") : free+" free"}</span>`;
}

function smsHref(phone, text){
  const sep = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? "&" : "?";
  return "sms:" + String(phone||"").replace(/[^\d+]/g,"") + sep + "body=" + encodeURIComponent(text);
}
function needsPickupReminder(j){
  if(j.status!=="setup" || (j.emails && j.emails.pickup) || j.pickupSkip) return false;
  const td = toDate(j.takedownAt); if(!td || isNaN(td) || td <= Date.now()) return false;
  const end = new Date(); end.setDate(end.getDate()+1); end.setHours(23,59,59,999);   // end of tomorrow
  return td <= end;                                                                    // due once it's the day before
}
function statusPill(j){
  const now = Date.now();
  if(needsPickupReminder(j) && !(toDate(j.takedownAt) <= now + 3*3600e3)) return `<span class="pill st-due">Remind customer</span>`;
  if(j.status==="setup" && toDate(j.takedownAt) && toDate(j.takedownAt) <= now + 3*3600e3) return `<span class="pill st-due">Take down ${toDate(j.takedownAt)<=now?"overdue":"soon"}</span>`;
  const map = {booked:["st-booked","Booked"],confirmed:["st-confirmed","Confirmed"],setup:["st-setup","Up in yard"],complete:["st-complete","Complete"]};
  const [c,t] = map[j.status] || map.booked;
  return `<span class="pill ${c}">${t}</span>`;
}
function photoSrc(j){ return j.photoId ? "/_blob/" + j.photoId : (j.photoData || ""); }
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.role="status"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function invoiceNo(j){ return j.invoiceNo || ("YC-" + (j.setupAt||"").slice(0,10).replace(/-/g,"") + "-" + j.id.slice(-4).toUpperCase()); }

/* ---------- routing ---------- */
let route = {view:"jobs", id:null};
function go(view, id=null){ route = {view, id}; render(); window.scrollTo(0,0); }
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

function iconInitials(s){ return (s.iconText || (s.name||"Y").trim().slice(0,1) || "Y").toUpperCase().slice(0,2); }
function brandMark(){
  const s = store.settings;
  if(s.logo) return `<div class="logo has-img" aria-hidden="true"><img src="${esc(s.logo)}" alt=""></div>`;
  return `<div class="logo" aria-hidden="true" style="background:${esc(s.iconColor||"#1E5C3B")}">${esc(iconInitials(s))}</div>`;
}
function topBar(title, sub, back){
  return `<header class="top">
    ${back ? `<button type="button" class="back" data-back aria-label="Back to jobs">←</button>` : `${brandMark()}`}
    <div><h1>${esc(title)}</h1>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
  </header>`;
}
function modeBanner(){
  if(store.mode==="local"){
    if(route.view!=="jobs") return "";
    if(sync.cfg()) return sync.banner();
    return `<div class="banner">Your jobs are saved on this phone, in this browser. Open the app the same way each time, or add it to your home screen.</div>`;
  }
  if(store.mode==="db-error") return `<div class="banner warn"><b>Lost connection to your saved jobs.</b> Reload the page to reconnect.</div>`;
  return "";
}

/* ---------- views ---------- */
function viewJobs(){
  const s = store.settings;
  const jobs = [...store.jobs];
  const now = Date.now(), soon = now + 36*3600e3;
  const takedowns = jobs.filter(j=>j.status==="setup").sort((a,b)=>String(a.takedownAt).localeCompare(String(b.takedownAt)));
  const upcoming = jobs.filter(j=>j.status==="booked"||j.status==="confirmed").sort((a,b)=>String(a.setupAt).localeCompare(String(b.setupAt)));
  const done = jobs.filter(j=>j.status==="complete").sort((a,b)=>String(b.takedownAt).localeCompare(String(a.takedownAt)));
  const setupSoon = upcoming.filter(j=>toDate(j.setupAt) && toDate(j.setupAt) <= soon);
  const card = (j, whenLabel, whenVal) => `
    <button type="button" class="job" data-open="${esc(j.id)}">
      <div class="thumb">${photoSrc(j) ? `<img src="${esc(photoSrc(j))}" alt="">` : esc((j.honoree||j.customerName||"?").trim().charAt(0).toUpperCase())}</div>
      <div>
        <div class="nm">${esc(j.honoree ? j.honoree : j.customerName)}${j.occasion?` · ${esc(j.occasion)}`:""}</div>
        <div class="meta">${esc(j.customerName)}${j.address?` · ${esc(j.address.split(",")[0])}`:""}</div>
        <div class="when">${whenLabel} ${esc(fmtWhen(whenVal))} · ${esc(relTime(whenVal))}</div>
      </div>
      ${statusPill(j)}
    </button>`;
  const due = takedowns.filter(needsPickupReminder);
  const dueBanner = due.length ? `<section class="banner warn" aria-label="Pick-up reminders due">
      <b>${due.length===1?"1 pick-up reminder is due":due.length+" pick-up reminders are due"}</b> — take-down is tomorrow or sooner.
      ${due.map(j=>`<div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><b>${esc(j.honoree||j.customerName)}</b><br><span class="fine">${esc(fmtWhen(j.takedownAt))}</span></div>
        <button type="button" class="btn pop" data-remind="${esc(j.id)}">Review & send</button>
        <button type="button" class="btn ghost" data-skip="${esc(j.id)}">Skip</button>
      </div>`).join("")}
    </section>` : "";
  const crewDue = upcoming.filter(needsCrewText);
  const crewBanner = crewDue.length ? `<section class="banner warn" aria-label="Crew texts due">
      <b>${crewDue.length===1?"1 crew text is due":crewDue.length+" crew texts are due"}</b> — set-up is within ${esc(String(Number(s.workerLeadHours)||24))} hours.
      ${crewDue.map(j=>`<div style="display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><b>${esc(j.honoree||j.customerName)}</b><br><span class="fine">${esc(fmtWhen(j.setupAt))} · ${esc((j.address||"").split(",")[0])}</span></div>
        <button type="button" class="btn pop" data-crewopen="${esc(j.id)}">Review & text</button>
        <button type="button" class="btn ghost" data-crewskip="${esc(j.id)}">Skip</button>
      </div>`).join("")}
    </section>` : "";
  const setupNote = s.name ? "" : `<div class="banner"><b>Add your business details</b> so emails carry your name, payment info and review links. <button type="button" class="btn ghost" data-go2="settings" style="padding:4px 8px;margin-left:4px">Set up</button></div>`;
  return topBar(s.name || "Yard Card Jobs", `${takedowns.length} in yards · ${upcoming.length} upcoming`) + modeBanner() + crewBanner + dueBanner + setupNote + `
    <div class="sec"><h2>Take-downs</h2><span class="count">${takedowns.length}</span></div>
    <div class="list">${takedowns.length ? takedowns.map(j=>card(j,"Take down",j.takedownAt)).join("") : `<div class="empty">Nothing in a yard right now.</div>`}</div>
    <div class="sec"><h2>Set-ups coming up</h2><span class="count">${setupSoon.length} in next 36 hr</span></div>
    <div class="list">${upcoming.length ? upcoming.map(j=>card(j,"Set up",j.setupAt)).join("") : `<div class="empty">No bookings yet. Tap <b>New booking</b> to add one.</div>`}</div>
    <div class="sec"><h2>Completed</h2><span class="count">${done.length}</span></div>
    <div class="list">${done.length ? done.slice(0,20).map(j=>card(j,"Taken down",j.takedownAt)).join("") : `<div class="empty">Finished jobs land here.</div>`}</div>`;
}

function signRow(j,i,checked){
  const q = Number((j.signQty||{})[i])||1;
  return `<div class="chk-row"><label class="chk"><input type="checkbox" data-sign value="${esc(i)}" ${checked?"checked":""}><span>${esc(i)}</span></label><input class="qty" type="number" data-qty inputmode="numeric" min="1" max="99" value="${q}" aria-label="How many: ${esc(i)}" ${checked?"":"hidden"}></div>`;
}
function numRow(j,i){
  const q = Number((j.signQty||{})[i])||1;
  return `<div class="chk-row"><label class="chk"><input type="checkbox" data-sign value="${esc(i)}" checked><span>${esc(i)}</span></label>${freeLabel(j,i)}<input class="qty" type="number" data-qty inputmode="numeric" min="1" max="99" value="${q}" aria-label="How many: ${esc(i)}"></div>`;
}
function crewCard(j){
  const s = store.settings, workers = parseWorkers(s.workers), cats = parseSigns(s.signs||DEFAULT_SIGNS);
  const occ = (j.occasion||"").trim().toLowerCase(), picked = new Set(j.signs||[]);
  const ex = pickExample(j), exs = store.examples || [];
  const sent = j.crewSent ? `<div class="sent">✓ Texted${j.crewSent.worker?" to "+esc(j.crewSent.worker):""} ${esc(fmtWhen(j.crewSent.at))}</div>` : "";
  return `<section class="card" id="crew-card">
    <h3>Crew set-up sheet</h3>
    <p class="hint">Pick the signs for this job, then text the details and an example photo to your worker.</p>
    <label>Worker<select id="crew-worker"><option value="">Choose in Messages</option>${workers.map(w=>`<option value="${esc(w.name)}" ${j.worker===w.name?"selected":""}>${esc(w.name)}${w.phone?" · "+esc(w.phone):""}</option>`).join("")}</select></label>
    ${workers.length?"":`<p class="fine" style="margin:4px 0 0">Add your crew under the <b>Crew</b> tab to pick them here.</p>`}
    <div style="margin-top:12px"><b style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)">Signs for this job</b>
      ${Object.keys(s.inventory||{}).length ? `<p class="fine" style="margin:2px 0 0">"Free" counts the signs you own (Business → Inventory) minus signs other jobs need on these dates.</p><div id="inv-warn">${shortWarning(j)}</div>` : `<p class="fine" style="margin:2px 0 0">Add how many of each sign you own under <b>Business → Inventory</b> to see what's free.</p>`}
      ${cats.length ? cats.map(c=>{
        const n = c.items.filter(i=>picked.has(i)).length;
        return `<details class="cat" ${(n||c.name.toLowerCase()===occ)?"open":""}><summary><span>${esc(c.name)}</span><span class="n">${n?n+" selected":""}</span></summary>
          ${c.items.map(i=>{ const q = Number((j.signQty||{})[i])||1; return `<div class="chk-row"><label class="chk"><input type="checkbox" data-sign value="${esc(i)}" ${picked.has(i)?"checked":""}><span>${esc(i)}</span></label>${freeLabel(j,i)}<input class="qty" type="number" data-qty inputmode="numeric" min="1" max="99" value="${q}" aria-label="How many: ${esc(i)}" ${picked.has(i)?"":"hidden"}></div>`; }).join("")}</details>`;
      }).join("") : `<p class="fine">No sign list yet — add one under the <b>Crew</b> tab.</p>`}
      ${(()=>{
        const nums = NUMBER_SIGNS.filter(i=>picked.has(i));
        return `<details class="cat" id="num-cat" ${(nums.length||/birthday|anniversary/.test(occ))?"open":""}><summary><span>Numbers</span><span class="n">${nums.length?nums.length+" selected":""}</span></summary>
          <div id="num-rows">${nums.map(i=>numRow(j,i)).join("")}</div>
          <label>Add a number sign<select id="num-add"><option value="">Choose a number</option>${NUMBER_SIGNS.map(i=>`<option value="${esc(i)}" ${picked.has(i)?"hidden":""}>${i.slice(7)}</option>`).join("")}</select></label>
          <p class="fine" style="margin:2px 0 0">For an age like 11, add the number 1 and set it to 2. For 40, add 4 and 0.</p></details>`;
      })()}
      ${(()=>{
        const known = new Set([...cats.flatMap(c=>c.items), ...NUMBER_SIGNS]);
        const orphans = (j.signs||[]).filter(i=>!known.has(i));
        return orphans.length ? `<details class="cat" open><summary><span>Not on your list anymore</span><span class="n">${orphans.length} selected</span></summary>
          <p class="fine" style="margin:0 0 4px">These were checked before the checklist changed. They still go in the text. Uncheck to remove.</p>
          ${orphans.map(i=>signRow(j,i,true)).join("")}</details>` : "";
      })()}
    </div>
    <label style="margin-top:10px">Notes for the crew<textarea id="crew-note" placeholder="Gate code, where to place it, colors…">${esc(j.workerNote||"")}</textarea></label>
    <label style="margin-top:10px">Example photo<select id="crew-ex"><option value="">Auto-match by occasion${ex&&!j.exampleId?" ("+esc(ex.label||"example")+")":""}</option>${exs.map(e=>`<option value="${esc(e.id)}" ${j.exampleId===e.id?"selected":""}>${esc(e.label||"Example")}${e.category?" · "+esc(e.category):""}</option>`).join("")}</select></label>
    <div id="crew-ex-prev">${ex?`<img class="exprev" src="${esc(exSrc(ex))}" alt="Example: ${esc(ex.label||"")}">`:`<p class="fine" style="margin:6px 0 0">${exs.length?"No example matches this occasion.":"No example photos yet — add some under the Crew tab."}</p>`}</div>
    ${sent}
    <div class="row"><button type="button" class="btn pop wide" data-crew-open>${j.crewSent?"Text crew again":"Preview & text crew"}</button></div>
  </section>`;
}
function shortWarning(j){
  const short = (j.signs||[]).filter(i=>{ const f = freeFor(j,i); return f!==null && qtyOf(j,i) > f; });
  return short.length ? `<div class="banner warn" style="margin:8px 0 0"><b>Not enough signs on these dates:</b> ${short.map(esc).join(", ")}. Another job has them, or you need more.</div>` : "";
}
function viewDetail(j){
  if(!j) return topBar("Job not found","",true) + `<div class="empty">This job was deleted.</div>`;
  const st = stage(j), t = totals(j), s = store.settings;
  const letters = (j.message||j.honoree||"YAY").replace(/[^A-Za-z0-9]/g,"").slice(0,4).toUpperCase().split("");
  const stepCls = n => n < st || j.status==="complete" ? "done" : n===st ? "now" : "";
  const sentLine = (k) => j.emails && j.emails[k] ? `<div class="sent">✓ ${j.emails[k].draft?"Saved as Gmail draft":j.emails[k].app?"Opened in your email app":"Emailed"} ${esc(fmtWhen(j.emails[k].at))}</div>` : "";

  let action = "";
  if(st===1){
    action = `<section class="card action">
      <h3>Confirm the booking</h3>
      <p class="hint">Emails ${esc(j.email||"the customer")} a summary of their request with the set-up and take-down times.</p>
      ${sentLine("confirmation")}
      <div class="row">
        <button type="button" class="btn pop" data-mail="confirmation">${j.emails&&j.emails.confirmation?"Send again":"Preview confirmation email"}</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <h3>Sign is up?</h3>
      <p class="hint">Add a photo of the finished yard, then mark it set up. The take-down reminder starts here.</p>
      <label class="btn" for="photo-in" style="display:inline-flex">📷 ${photoSrc(j)?"Replace photo":"Add photo of finished job"}</label>
      <input id="photo-in" type="file" accept="image/*" capture="environment" hidden>
      ${photoSrc(j)?`<div class="photo"><img src="${esc(photoSrc(j))}" alt="Finished yard card for ${esc(j.honoree||j.customerName)}"></div>`:""}
      <div class="row"><button type="button" class="btn primary wide" data-act="setup" ${photoSrc(j)?"":"disabled"}>Mark set up</button></div>
      ${photoSrc(j)?"":`<p class="fine" style="margin:6px 0 0">Add the photo first — it goes into the customer's email.</p>`}
    </section>`;
  }else if(st===2){
    const td = toDate(j.takedownAt), overdue = td && td <= Date.now();
    action = `<section class="card action">
      <h3>Take-down reminder</h3>
      <div class="countdown">${overdue?"Overdue — ":""}${esc(fmtWhen(j.takedownAt))}</div>
      <p class="hint" style="margin-top:4px">${esc(relTime(j.takedownAt))} · ${esc(j.address)}</p>
      ${needsPickupReminder(j)?`<div class="banner warn" style="margin-top:8px"><b>Pick-up is coming up.</b> Send the customer a reminder below.</div>`:""}
      <div class="photo"><img src="${esc(photoSrc(j))}" alt="Finished yard card for ${esc(j.honoree||j.customerName)}"></div>
      <div class="row">
        <button type="button" class="btn pop" data-mail="setup">${j.emails&&j.emails.setup?"Resend photo email":"Email customer the photo"}</button>
      </div>
      ${sentLine("setup")}
      <div class="row">
        <button type="button" class="btn pop" data-mail="pickup">${j.emails&&j.emails.pickup?"Resend pick-up reminder":"Remind customer of pick-up"}</button>
        <button type="button" class="btn" data-mail="reminder">Email me a reminder</button>
      </div>
      ${sentLine("pickup")}
      ${sentLine("reminder")}
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <h3>Sign is picked up?</h3>
      <p class="hint">Marks the job done and opens the invoice + review request email.</p>
      <div class="row"><button type="button" class="btn primary wide" data-act="takedown">Mark taken down</button></div>
    </section>`;
  }else{
    action = `<section class="card action">
      <h3>Invoice & review request</h3>
      <p class="hint">Invoice ${esc(invoiceNo(j))} · balance ${money(t.due)}. Includes links to ${["facebook","instagram","google"].filter(k=>s[k]).map(k=>k[0].toUpperCase()+k.slice(1)).join(", ")||"your review pages (add them under Business)"}.</p>
      ${sentLine("final")}
      <div class="row"><button type="button" class="btn pop wide" data-mail="final">${j.emails&&j.emails.final?"Send again":"Preview invoice email"}</button></div>
      ${photoSrc(j)?`<div class="photo"><img src="${esc(photoSrc(j))}" alt="Finished yard card for ${esc(j.honoree||j.customerName)}"></div>`:""}
    </section>`;
  }

  return topBar(j.customerName, j.address, true) + `
    <div class="hero">
      <div class="stakes" aria-hidden="true">${letters.map(l=>`<span>${esc(l)}</span>`).join("")}</div>
      <div class="occ">${esc(j.occasion||"Yard card")}</div>
      <h2>${esc(j.honoree||j.customerName)}</h2>
      ${j.message?`<div class="msg">“${esc(j.message)}”</div>`:""}
      ${j.team?`<div class="msg">Team: ${esc(j.team)}</div>`:""}
    </div>
    <ol class="steps" aria-label="Job progress">
      <li class="${stepCls(1)}"><span class="n">1</span>Booked</li>
      <li class="${stepCls(2)}"><span class="n">2</span>Set up</li>
      <li class="${stepCls(3)}"><span class="n">3</span>Taken down</li>
    </ol>
    ${action}
    ${j.status!=="complete" ? crewCard(j) : ""}
    <section class="card">
      <h3>Booking</h3>
      <dl class="kv">
        <dt>Set up</dt><dd>${esc(fmtWhen(j.setupAt))}</dd>
        <dt>Take down</dt><dd>${esc(fmtWhen(j.takedownAt))}</dd>
        <dt>Email</dt><dd>${esc(j.email)}</dd>
        ${j.phone?`<dt>Phone</dt><dd>${esc(j.phone)}</dd>`:""}
        <dt>Address</dt><dd>${esc(j.address)}</dd>
        <dt>Request</dt><dd>${esc(j.request||"—")}</dd>
        <dt>Total</dt><dd>${money(t.total)}${t.paid?` · ${money(t.paid)} paid`:""}</dd>
      </dl>
      <div class="row">
        <button type="button" class="btn" data-act="edit">Edit</button>
        ${st>1?`<button type="button" class="btn ghost" data-act="undo">Move back a step</button>`:""}
        <button type="button" class="btn danger" data-act="delete">Delete</button>
      </div>
      <div id="del-confirm" hidden class="status err">Delete this job for good?
        <div class="row"><button type="button" class="btn danger" data-act="delete-yes">Delete</button><button type="button" class="btn" data-act="delete-no">Keep</button></div></div>
    </section>`;
}

}

function inventoryRows(){
  const s = store.settings, inv = s.inventory||{}, cats = parseSigns(s.signs||DEFAULT_SIGNS);
  const row = i => { const out = inYardNow(i); return `<div class="inv-row"><span>${esc(i)}</span><span class="use">${out?out+" in yards now":""}</span><input class="qty" type="number" inputmode="numeric" min="0" max="999" data-inv="${esc(i)}" value="${esc(inv[i]??"")}" placeholder="—" aria-label="How many you own: ${esc(i)}"></div>`; };
  const known = new Set([...cats.flatMap(c=>c.items), ...NUMBER_SIGNS]);
  const old = Object.keys(inv).filter(i=>!known.has(i));
  return (cats.length ? cats.map(c=>`<div class="inv-cat">${esc(c.name)}</div>${c.items.map(row).join("")}`).join("") : `<p class="fine">No signs yet. Add your sign checklist under the <b>Crew</b> tab first.</p>`)
    + `<div class="inv-cat">Numbers</div>${NUMBER_SIGNS.map(row).join("")}`
    + (old.length ? `<div class="inv-cat">Not on your checklist anymore</div><p class="fine" style="margin:0">Clear the number to remove one.</p>${old.map(row).join("")}` : "")
    + `<div class="row"><button type="button" class="btn ghost" data-go2="crew">Edit the sign list under Crew</button></div>`;
}

function render(){
  const app = $("#app");
  const j = route.id ? store.jobs.find(x=>x.id===route.id) : null;
  if(route.view==="jobs") app.innerHTML = viewJobs();
  else if(route.view==="new") app.innerHTML = viewForm(null);
  else if(route.view==="edit") app.innerHTML = viewForm(j);
  else if(route.view==="job") app.innerHTML = viewDetail(j);
  else if(route.view==="settings") app.innerHTML = viewSettings();
  else if(route.view==="crew") app.innerHTML = viewCrew();
  ["jobs","crew","settings"].forEach(v=>{ const b=$("#nav-"+v); if(route.view===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  bind(j);
}
// Re-render on data changes, except while a form is being filled in.
let holdRender = false;
store.listeners.push(()=>{ if(holdRender) return; if(!["new","edit","settings","crew"].includes(route.view)) render(); });

function bind(j){
  const app = $("#app");
  app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go(route.view==="edit"&&j?"job":"jobs", route.view==="edit"&&j?j.id:null));
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("job", b.dataset.open));
  app.querySelectorAll("[data-sync-ask]").forEach(b=>b.onclick=()=>sync.ask());
  app.querySelectorAll("[data-go2]").forEach(b=>b.onclick=()=>go(b.dataset.go2));
  app.querySelectorAll("[data-remind]").forEach(b=>b.onclick=()=>{ const jj = store.jobs.find(x=>x.id===b.dataset.remind); if(jj) openMail("pickup", jj); });
  app.querySelectorAll("[data-crewopen]").forEach(b=>b.onclick=()=>{ const jj = store.jobs.find(x=>x.id===b.dataset.crewopen); if(jj) openCrew(jj); });
  app.querySelectorAll("[data-crewskip]").forEach(b=>b.onclick=async()=>{ const jj = store.jobs.find(x=>x.id===b.dataset.crewskip); if(!jj) return; try{ await store.saveJob({...jj, crewSkip:true}); toast("Crew text skipped"); render(); }catch(e){ toast("Couldn't save — try again"); } });
  app.querySelectorAll("[data-skip]").forEach(b=>b.onclick=async()=>{ const jj = store.jobs.find(x=>x.id===b.dataset.skip); if(!jj) return; try{ await store.saveJob({...jj, pickupSkip:true}); toast("Reminder skipped"); render(); }catch(e){ toast("Couldn't save — try again"); } });

  const form = $("#jobform");
  if(form){
    let n = 100;
    const recalc = ()=>{ $("#f-total").textContent = money(totals(readForm(form)).due); };
    $("#add-addon").onclick = ()=>{ $("#addons").insertAdjacentHTML("beforeend", addonRow(undefined, n++)); };
    form.addEventListener("click", e=>{ if(e.target.closest("[data-rm-addon]")){ e.target.closest("[data-addon]").remove(); recalc(); }});
    form.addEventListener("input", recalc);
    form.onsubmit = async e=>{
      e.preventDefault();
      const data = readForm(form), err = $("#form-err");
      const missing = [];
      if(!data.customerName) missing.push("customer name");
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email||"")) missing.push("a valid email");
      if(!data.address) missing.push("address");
      if(!data.setupAt) missing.push("set-up time");
      if(!data.takedownAt) missing.push("take-down time");
      if(missing.length){ err.hidden=false; err.textContent = "Add " + missing.join(", ") + " to save."; return; }
      if(data.takedownAt <= data.setupAt){ err.hidden=false; err.textContent = "Take-down needs to be after set-up."; return; }
      const job = j ? {...j, ...data} : {id:newId(), status:"booked", emails:{}, createdAt:new Date().toISOString(), ...data};
      try{ await store.saveJob(job); toast(j?"Changes saved":"Booking saved"); go("job", job.id); }
      catch(ex){ err.hidden=false; err.textContent = "Couldn't save — " + (ex && ex.message || "try again."); }
    };
  }

  const sf = $("#setform");
  if(sf){
    sf.onsubmit = async e=>{
      e.preventDefault();
      const s = {...DEFAULT_SETTINGS, ...store.settings};
      new FormData(sf).forEach((v,k)=>s[k]=String(v).trim());
      const inv = {};
      sf.querySelectorAll("[data-inv]").forEach(inp=>{ const v = inp.value.trim(); if(v!=="") inv[inp.dataset.inv] = Math.max(0, Math.min(999, parseInt(v,10)||0)); });
      s.inventory = inv;
      const su = $("#sy-url"), sc = $("#sy-code");
      if(su){
        const url = su.value.trim(), code = sc.value.trim(), old = store.local("ycj-sync") || {};
        if(url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ toast("The sync address should start with https://script.google.com/"); su.focus(); return; }
        if(url && !code){ toast("Enter the sync code too"); sc.focus(); return; }
        if(!url && old.url){ sync.disconnect(); }
        else if(url && (url!==old.url || code!==old.code)){ pendingSyncUrl = ""; sync.connect(url, code); }
      }
      // Only save when something changed, so connecting a new phone doesn't overwrite the business details in Drive.
      const same = JSON.stringify({...s, updatedAt:0}) === JSON.stringify({...DEFAULT_SETTINGS, ...store.settings, updatedAt:0});
      if(same){ toast("Business details saved"); return go("jobs"); }
      try{ await store.saveSettings(s); toast("Business details saved"); go("jobs"); }
      catch(ex){ toast("Couldn't save — try again"); }
    };
  }

  if(route.view==="settings"){
    refreshBrandPreview();
    const lin = $("#logo-in"); if(lin) lin.onchange = ()=>handleLogo(lin.files[0]);
    const lrm = $("#logo-rm"); if(lrm) lrm.onclick = async()=>{ try{ await store.saveSettings({...store.settings, logo:""}); toast("Logo removed"); render(); applyIcon(); }catch(e){ toast("Couldn't remove — try again"); } };
    const it = $("#s-icontext"); if(it) it.oninput = refreshBrandPreview;
    sf.querySelectorAll('[name="iconColor"]').forEach(r=>r.onchange = refreshBrandPreview);
  }

  if(route.view==="crew"){
    refreshExamples();
    const cf = $("#crewform");
    cf.onsubmit = async e=>{
      e.preventDefault();
      const ns = {...DEFAULT_SETTINGS, ...store.settings};
      new FormData(cf).forEach((v,k)=>ns[k]=String(v).trim());
      try{ await store.saveSettings(ns); toast("Crew settings saved"); go("jobs"); }
      catch(ex){ toast("Couldn't save — try again"); }
    };
    cf.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{ const k=b.dataset.reset; cf.elements[k].value = k==="signs" ? DEFAULT_SIGNS : DEFAULT_WORKER_TEXT; });
    const exin = $("#ex-in"); exin.onchange = ()=>handleExample(exin.files[0]);
  }

  if(route.view==="job" && j){
    const cc = $("#crew-card");
    if(cc){
      const cur = ()=>store.jobs.find(x=>x.id===j.id) || j;
      const persist = async patch=>{
        holdRender = true;
        try{ await store.saveJob({...cur(), ...patch}); }catch(e){ toast("Couldn't save — try again"); }
        setTimeout(()=>{ holdRender = false; }, 800);
      };
      $("#crew-worker").onchange = e=>persist({worker:e.target.value});
      const saveSigns = ()=>{
        const signs = [], signQty = {};
        cc.querySelectorAll(".chk-row").forEach(r=>{
          const cb = r.querySelector("[data-sign]"), q = r.querySelector("[data-qty]");
          q.hidden = !cb.checked;
          if(cb.checked){ signs.push(cb.value); signQty[cb.value] = Math.max(1, Math.min(99, parseInt(q.value,10)||1)); }
        });
        persist({signs, signQty});
        const tmp = {...cur(), signs, signQty};
        cc.querySelectorAll("[data-free]").forEach(el=>{ const n = el.dataset.free, free = freeFor(tmp,n), short = qtyOf(tmp,n) > free; el.className = "free" + (short?" short":""); el.textContent = short ? (free<=0?"None free":"Only "+free+" free") : free+" free"; });
        const w = $("#inv-warn"); if(w) w.innerHTML = shortWarning(tmp);
        cc.querySelectorAll("details.cat").forEach(d=>{ const n=d.querySelectorAll("[data-sign]:checked").length; d.querySelector(".n").textContent = n? n+" selected":""; });
      };
      const wire = root=>{
        root.querySelectorAll("[data-sign]").forEach(cb=>cb.onchange = saveSigns);
        root.querySelectorAll("[data-qty]").forEach(q=>{ q.onchange = saveSigns; q.onfocus = ()=>q.select(); });
      };
      wire(cc);
      const na = $("#num-add");
      if(na) na.onchange = ()=>{
        const name = na.value; if(!name) return;
        const box = $("#num-rows"), had = box.querySelector(`[data-sign][value="${name}"]`);
        if(had){ had.checked = true; }
        else { box.insertAdjacentHTML("beforeend", numRow({...cur(), signQty:{}}, name)); wire(box.lastElementChild); }
        na.querySelector(`option[value="${name}"]`).hidden = true; na.value = "";
        saveSigns();
        const q = box.querySelector(`[data-sign][value="${name}"]`).closest(".chk-row").querySelector("[data-qty]"); q.focus();
      };
      $("#crew-note").onchange = e=>persist({workerNote:e.target.value.trim()});
      $("#crew-ex").onchange = async e=>{
        await persist({exampleId:e.target.value});
        const ex = pickExample(cur()), box = $("#crew-ex-prev");
        box.innerHTML = ex ? `<img class="exprev" src="${esc(exSrc(ex))}" alt="Example: ${esc(ex.label||"")}">` : `<p class="fine" style="margin:6px 0 0">No example matches this occasion.</p>`;
      };
      cc.querySelector("[data-crew-open]").onclick = ()=>openCrew(cur());
    }
    app.querySelectorAll("[data-mail]").forEach(b=>b.onclick=()=>openMail(b.dataset.mail, j));
    const pin = $("#photo-in"); if(pin) pin.onchange = ()=>handlePhoto(pin.files[0], j);
    app.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
      const a = b.dataset.act;
      if(a==="edit") return go("edit", j.id);
      if(a==="delete"){ $("#del-confirm").hidden=false; return; }
      if(a==="delete-no"){ $("#del-confirm").hidden=true; return; }
      if(a==="delete-yes"){ await store.removeJob(j.id); toast("Job deleted"); return go("jobs"); }
      if(a==="setup"){ await store.saveJob({...j, status:"setup", setupDoneAt:new Date().toISOString()}); toast("Marked set up"); render(); openMail("setup", store.jobs.find(x=>x.id===j.id)||j); return; }
      if(a==="takedown"){ const up = {...j, status:"complete", takedownDoneAt:new Date().toISOString(), invoiceNo: invoiceNo(j)}; await store.saveJob(up); toast("Job complete"); render(); openMail("final", store.jobs.find(x=>x.id===j.id)||up); return; }
      if(a==="undo"){ await store.saveJob({...j, status: j.status==="complete"?"setup":"confirmed"}); toast("Moved back a step"); render(); }
    });
  }
}
function readForm(form){
  const d = {};
  ["customerName","email","phone","address","occasion","honoree","message","team","request","setupAt","takedownAt","price","deposit"].forEach(k=>{
    const el = form.elements[k]; d[k] = el ? el.value.trim() : "";
  });
  d.addons = [...form.querySelectorAll("[data-addon]")].map(r=>({desc:r.querySelector('[name="addon-desc"]').value.trim(), amount:r.querySelector('[name="addon-amt"]').value})).filter(a=>a.desc||a.amount);
  return d;
}

/* ---------- logo & app icon ---------- */
async function squareDataUrl(file, size){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const c = document.createElement("canvas"); c.width = c.height = size;
    const ctx = c.getContext("2d");
    const k = Math.min(size/img.naturalWidth, size/img.naturalHeight);
    const w = img.naturalWidth*k, h = img.naturalHeight*k;
    ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
    let out = c.toDataURL("image/png");
    if(out.length > 180000){
      ctx.globalCompositeOperation = "destination-over"; ctx.fillStyle = "#fff"; ctx.fillRect(0,0,size,size);
      out = c.toDataURL("image/jpeg",0.85);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
async function handleLogo(file){
  if(!file) return;
  toast("Adding logo…");
  let data;
  try{ data = await squareDataUrl(file, 256); }catch(e){ return toast("That file isn't an image this app can read"); }
  try{
    // keep any unsaved text in the form out of this save; only the logo changes
    await store.saveSettings({...store.settings, logo:data});
    toast("Logo saved"); render(); applyIcon();
  }catch(e){ toast("Couldn't save the logo — try a smaller image"); }
}
function refreshBrandPreview(){
  const el = $("#brand-prev"); if(!el) return;
  const s = store.settings;
  if(s.logo){ el.style.background = "var(--surface)"; el.innerHTML = `<img src="${esc(s.logo)}" alt="">`; return; }
  const sf = $("#setform");
  const col = (sf && sf.elements.iconColor && sf.elements.iconColor.value) || s.iconColor || "#1E5C3B";
  const txt = ((sf && sf.elements.iconText && sf.elements.iconText.value.trim()) || "") || iconInitials({...s,iconText:""});
  el.style.background = col; el.textContent = txt.toUpperCase().slice(0,2);
}
function applyIcon(){
  try{
    const s = store.settings;
    document.title = s.name || "Yard Card Jobs";
    const c = document.createElement("canvas"); c.width = c.height = 180;
    const ctx = c.getContext("2d");
    const finish = ()=>{
      const href = c.toDataURL("image/png");
      [["icon",null],["apple-touch-icon","180x180"]].forEach(([rel,sz])=>{
        let l = document.querySelector(`link[rel="${rel}"]`);
        if(!l){ l = document.createElement("link"); l.rel = rel; document.head.appendChild(l); }
        if(sz) l.setAttribute("sizes",sz);
        l.href = href;
      });
    };
    if(s.logo){
      const img = new Image();
      img.onload = ()=>{ ctx.fillStyle="#fff"; ctx.fillRect(0,0,180,180); ctx.drawImage(img,10,10,160,160); finish(); };
      img.src = s.logo;
    }else{
      ctx.fillStyle = s.iconColor || "#1E5C3B"; ctx.fillRect(0,0,180,180);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "96px 'Lilita One','Arial Rounded MT Bold',Arial,sans-serif";
      ctx.fillText(iconInitials(s),90,96); finish();
    }
  }catch(e){}
}
store.listeners.push(applyIcon);

/* ---------- example photos ---------- */
function cleanLink(v){ v = String(v||"").trim(); return /^https?:\/\/\S+$/i.test(v) ? v : ""; }
function refreshExamples(){
  const g = $("#ex-grid"); if(!g) return;
  const list = store.examples || [];
  g.innerHTML = list.length ? list.map(ex=>`<div class="ex"><img src="${esc(exSrc(ex))}" alt=""><div class="grow"><b>${esc(ex.label||"Example")}</b><br><span class="fine">${esc(ex.category||"No occasion set")}</span><input class="exlink" data-ex-link="${esc(ex.id)}" type="url" inputmode="url" placeholder="Photo link (optional)" value="${esc(ex.link||"")}" aria-label="Photo link for ${esc(ex.label||"example")}" style="width:100%;margin-top:6px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px"></div><button type="button" class="btn danger" data-ex-del="${esc(ex.id)}">Delete</button></div>`).join("") : `<div class="empty">No example photos yet.</div>`;
  g.querySelectorAll("[data-ex-link]").forEach(inp=>inp.onchange = async()=>{
    const ex = (store.examples||[]).find(x=>x.id===inp.dataset.exLink); if(!ex) return;
    const v = cleanLink(inp.value);
    if(inp.value.trim() && !v){ inp.value = ex.link||""; return toast("Links need to start with http:// or https://"); }
    try{ await store.saveExample({...ex, link:v}); inp.value = v; toast(v?"Link saved":"Link removed"); }catch(e){ toast("Couldn't save — try again"); }
  });
  g.querySelectorAll("[data-ex-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent="Tap again to delete"; setTimeout(()=>{ b.dataset.armed=""; b.textContent="Delete"; },3000); return; }
    try{ await store.removeExample(b.dataset.exDel); toast("Example deleted"); refreshExamples(); }catch(e){ toast("Couldn't delete — try again"); }
  });
}
async function handleExample(file){
  if(!file) return;
  toast("Adding example…");
  let blob;
  try{ blob = await shrink(file, 1400); }catch(e){ return toast("That file isn't a photo this app can read"); }
  const ex = {id:"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), label:($("#ex-label").value.trim()||"Example"), category:$("#ex-cat").value.trim(), link:cleanLink($("#ex-link").value), createdAt:new Date().toISOString()};
  let assets = null;
  try{ assets = window.claude && await window.claude.use("assets"); }catch(e){}
  try{
    if(assets){ const up = await assets.upload(blob, {type:"image/jpeg"}); ex.photoId = up.id; }
    else{ ex.photoData = "data:image/jpeg;base64," + await blobToB64(await shrink(file, 600)); }
    await store.saveExample(ex);
    $("#ex-label").value = ""; $("#ex-cat").value = ""; $("#ex-link").value = ""; $("#ex-in").value = "";
    toast("Example added"); refreshExamples();
  }catch(e){
    toast(e && e.code==="quota_or_state" ? "Photo storage is full — delete old photos" : "Couldn't save the photo — try again");
  }
}
async function exampleBlob(ex){
  if(ex.photoId){ const r = await fetch("/_blob/"+ex.photoId); if(!r.ok) throw new Error("fetch"); return await r.blob(); }
  return await (await fetch(ex.photoData)).blob();
}

    <div id="c-status" class="status" hidden></div>
    <div class="row">
      <a class="btn primary" id="c-sms" href="#">Text it</a>
      ${ex && navigator.share ? `<button type="button" class="btn pop" id="c-share">Share with photo</button>` : ""}

  const regen = ()=>{ ta.value = buildCrewText(cur(), worker); refreshTo(); };
